[package]
name = "anki-backend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
axum = { version = "0.8.9", features = ["multipart", "macros"] }
axum-macros = "0.5.1"
tower = { version = "0.5.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
aws-config = { version = "1.10.1", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.140.0", features = ["behavior-version-latest"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "array-impls", "with-serde_json-1", "with-uuid-1"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.33"
async-recursion = "1.1.1"
flate2 = "1.1.9"
base64 = "0.23.0"
regex = "1.13.1"
bb8-postgres = "0.9.0"
once_cell = "1.21.4"
sentry = "0.48.5"
axum-client-ip = "1.3.1"
rust-argon2 = "3.0.0"
html5ever = "*"
ammonia = "4.1.4"
dotenvy = "0.15.7"
md-5 = "0.11.0"
sha2 = "0.11.0"
async_zip = { version = "0.0.18", features = ["full"] }
svg-hush = "0.9.6"
bytes = "1.12.1"
hex = "0.4.3"
governor = "0.10.4"
tower_governor = { version = "0.8.0", features = ["axum"] }
rand = "0.10.2"
lazy_static = "1.5.0"
rayon = "1.12.0"
hmac = "0.13.0"
hyper = "1.11.0"
http-body-util = "0.1.4"
serde_urlencoded = "0.7.1"
infer = "0.22.0"
htmldiff = { path = "../website/htmldiff" }

[dependencies.uuid]
version = "1.24.0"
features = [
    "v4",                # Lets you generate random UUIDs
    "fast-rng",          # Use a faster (but still sufficiently random) RNG
    "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
]

