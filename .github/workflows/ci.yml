name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AnkiCollab-Backend
        uses: actions/checkout@v4

      # `htmldiff` is a path dependency pointing at `../website/htmldiff`
      # (see Cargo.toml). actions/checkout won't check a repo out *outside*
      # $GITHUB_WORKSPACE (path traversal is blocked for security reasons),
      # so we check Website out into a subfolder inside the workspace, then
      # symlink it to the sibling path Cargo actually expects.
      - name: Checkout AnkiCollab-Website (htmldiff dependency)
        uses: actions/checkout@v4
        with:
          repository: CravingCrates/AnkiCollab-Website
          path: website-src

      - name: Symlink website repo to expected sibling path
        run: ln -s "$GITHUB_WORKSPACE/website-src" "$GITHUB_WORKSPACE/../website"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # -D warnings denies clippy::all + clippy::pedantic (enforced by the
        # #![warn(...)] attributes in main.rs). -A clippy::nursery excludes
        # the nursery group specifically, since those lints are explicitly
        # unstable/experimental and shouldn't be able to break CI on their own.
        run: cargo clippy --all-targets --all-features -- -D warnings -A clippy::nursery

      - name: Run tests
        run: cargo test --all-features --verbose
